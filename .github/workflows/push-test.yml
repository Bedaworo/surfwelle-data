name: Push test message

# Manuell starten (Actions -> "Push test message" -> Run workflow) und im
# Feld die Kennung des Geraets eintragen (steht auf der Seite unter den
# Benachrichtigungen), mehrere kommagetrennt - oder "alle".
on:
  workflow_dispatch:
    inputs:
      kennung:
        description: 'Kennung(en) wie auf der Seite angezeigt, kommagetrennt - oder "alle"'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Send test push
        run: |
          npm install --omit=dev --no-audit --no-fund --silent
          node notify.js --test --dry-run --state /tmp/state.json --log /tmp/log.jsonl
        env:
          PUSH_TEST_TARGET: ${{ inputs.kennung }}
          PUSH_ADMIN_TOKEN: ${{ secrets.PUSH_ADMIN_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
